name: CI

on:
  push:
    branches:
      - main
      - dev
      - openrvdas
      - openrvdas_dev
  pull_request:
    branches:
      - main
      - dev
      - openrvdas
      - openrvdas_dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
