version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Font Awesome packages pin exact fontawesome-common-types versions, so
      # bumping them separately installs mismatched copies and breaks type-check.
      fortawesome:
        patterns:
          - "@fortawesome/*"
      # react and react-dom must be the exact same version at runtime, so
      # bumping them in separate PRs fails tests in each.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # Types should track the Node major used by CI (.github/workflows/ci.yml).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react doesn't support ESLint 10 yet (peer: eslint ^9.7).
      # Remove once it does.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
