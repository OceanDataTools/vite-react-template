server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Optional reverse proxy for /api/, generated at container start from
    # API_UPSTREAM by /docker-entrypoint.d/15-api-proxy.sh (empty if unset).
    include /etc/nginx/snippets/api-proxy.conf;

    # Hashed build output: safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (e.g. /profile) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
